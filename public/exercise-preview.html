<!doctype html>
<html lang="fr"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>rouXperf — aperçu des animations d'exercices</title>
<style>
  body{margin:0;padding:24px;background:#0a0a0a;color:#f5f5f0;font-family:system-ui,sans-serif}
  h1{font-size:1.4rem}
  p.note{color:#8f8f89;font-size:.85rem;max-width:640px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:20px}
  .card{margin:0;background:#141414;border:1px solid rgba(245,245,240,.12);border-radius:8px;padding:12px;text-align:center}
  .loop{position:relative;width:100%;aspect-ratio:1/1;background:#f5f5f0;border-radius:8px;padding:10px;box-sizing:border-box}
  .loop img{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:contain;transition:opacity .5s ease-in-out}
  figcaption{margin-top:8px;font-size:.85rem}
  small{color:#8f8f89;font-size:.7rem}
</style></head>
<body>
  <h1>Aperçu des animations d'exercices</h1>
  <p class="note">Chaque vignette enchaîne les 2 poses en fondu croisé, comme dans la page Séance de l'app. Illustrations : Everkinetic — CC BY-SA 3.0, via OpenTraining.</p>
  <div class="grid">
<figure class="card"><div class="loop" data-frames='["/exercises/squats-1.svg","/exercises/squats-2.svg"]'></div><figcaption>Squat<br><small>squats · 2 pose(s) · svg</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/pushup-1.svg","/exercises/pushup-2.svg"]'></div><figcaption>Pompes<br><small>pushup · 2 pose(s) · svg</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/superman-1.svg","/exercises/superman-2.svg"]'></div><figcaption>Superman<br><small>superman · 2 pose(s) · svg</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/bridge-1.svg","/exercises/bridge-2.svg"]'></div><figcaption>Pont fessier<br><small>bridge · 2 pose(s) · svg</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/dips-1.svg","/exercises/dips-2.svg"]'></div><figcaption>Dips<br><small>dips · 2 pose(s) · svg</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/benchpress-1.svg","/exercises/benchpress-2.svg"]'></div><figcaption>Développé couché barre<br><small>benchpress · 2 pose(s) · svg</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/dumbbellbenchpress-1.png","/exercises/dumbbellbenchpress-2.png"]'></div><figcaption>Développé couché haltères<br><small>dumbbellbenchpress · 2 pose(s) · png</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/dumbbellinclinebenchpress-1.png","/exercises/dumbbellinclinebenchpress-2.png"]'></div><figcaption>Développé incliné haltères<br><small>dumbbellinclinebenchpress · 2 pose(s) · png</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/seatedmilitaryshoulderpress-1.png","/exercises/seatedmilitaryshoulderpress-2.png"]'></div><figcaption>Développé militaire barre<br><small>seatedmilitaryshoulderpress · 2 pose(s) · png</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/dumbbellshoulderpress-1.png","/exercises/dumbbellshoulderpress-2.png"]'></div><figcaption>Développé épaules haltères<br><small>dumbbellshoulderpress · 2 pose(s) · png</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/inclinechestpress-1.png","/exercises/inclinechestpress-2.png"]'></div><figcaption>Développé assis machine<br><small>inclinechestpress · 2 pose(s) · png</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/curl-standing-1.svg","/exercises/curl-standing-2.svg"]'></div><figcaption>Curl biceps<br><small>curl-standing · 2 pose(s) · svg</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/dumbbell-lateral-raise-1.svg","/exercises/dumbbell-lateral-raise-2.svg"]'></div><figcaption>Élévations latérales<br><small>dumbbell-lateral-raise · 2 pose(s) · svg</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/triceps-kickback-1.svg","/exercises/triceps-kickback-2.svg"]'></div><figcaption>Extension triceps<br><small>triceps-kickback · 2 pose(s) · svg</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/lunges-dumbbell-1.svg","/exercises/lunges-dumbbell-2.svg"]'></div><figcaption>Fentes<br><small>lunges-dumbbell · 2 pose(s) · svg</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/walkinglunges-1.png","/exercises/walkinglunges-2.png","/exercises/walkinglunges-3.png","/exercises/walkinglunges-4.png"]'></div><figcaption>Goblet lunge<br><small>walkinglunges · 4 pose(s) · png</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/t-bar-row-1.svg","/exercises/t-bar-row-2.svg"]'></div><figcaption>Rowing barre<br><small>t-bar-row · 2 pose(s) · svg</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/cableseatedrows-1.png","/exercises/cableseatedrows-2.png"]'></div><figcaption>Rowing poulie basse<br><small>cableseatedrows · 2 pose(s) · png</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/chinups-1.png","/exercises/chinups-2.png"]'></div><figcaption>Tractions<br><small>chinups · 2 pose(s) · png</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/deadlifts-1.png","/exercises/deadlifts-2.png"]'></div><figcaption>Soulevé de terre<br><small>deadlifts · 2 pose(s) · png</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/widegriplatpulldown-1.gif","/exercises/widegriplatpulldown-2.gif"]'></div><figcaption>Tirage vertical<br><small>widegriplatpulldown · 2 pose(s) · gif</small></figcaption></figure>
<figure class="card"><div class="loop" data-frames='["/exercises/seatedlegcurl-1.png","/exercises/seatedlegcurl-2.png"]'></div><figcaption>Leg curl<br><small>seatedlegcurl · 2 pose(s) · png</small></figcaption></figure>
  </div>
<script>
  for (const el of document.querySelectorAll('.loop[data-frames]')) {
    const frames = JSON.parse(el.dataset.frames);
    const imgs = frames.map((src, i) => {
      const img = document.createElement('img');
      img.src = src; img.alt = ''; img.style.opacity = i === 0 ? '1' : '0';
      el.appendChild(img); return img;
    });
    if (imgs.length < 2) continue;
    let f = 0;
    setInterval(() => {
      imgs[f].style.opacity = '0';
      f = (f + 1) % imgs.length;
      imgs[f].style.opacity = '1';
    }, 1100);
  }
</script>
</body></html>

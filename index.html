<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* rouxperf — anti-flash de thème : applique data-theme avant le premier rendu */
      (function () {
        try {
          var stored = localStorage.getItem("rouxperf-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="rouxperf.ch — programme d'entraînement personnalisé, généré pour toi." />
    <title>rouxperf.ch</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Valeur du thème clair (défaut) ; le ThemeProvider la réaligne sur le
         fond réel dès le premier rendu si l'utilisateur est en sombre. -->
    <meta name="theme-color" content="#FAF8F5" />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="rouxperf" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Connexion établie tôt vers Supabase (auth + données) : la poignée de
         main TLS se fait pendant le téléchargement du JS plutôt qu'après, ce
         qui raccourcit d'autant la latence perçue à la connexion (Google y
         compris, qui passe par /auth/v1 de Supabase). -->
    <link rel="preconnect" href="https://nbyvxuvnlcyofytvmsvl.supabase.co" crossorigin />
    <!-- Polices : Anton/IBM Plex (marque) + Archivo/Inter (thème rouxperf) en une seule requête -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@400;500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
